# See https://stylelint.io/user-guide/rules
# Also https://github.com/stylelint-scss/stylelint-scss#list-of-rules

extends:
  - stylelint-config-standard-scss
  - stylelint-prettier/recommended

ignoreFiles:
  - "test/**/*.*"

rules:
  # Enforce kebab-case naming for the library's public API.
  scss/at-function-pattern:
    - "^([_|-]*[a-z][a-z0-9]*)(-[a-z0-9]+)*-*$"
    - message: "Expected function to be kebab-case"
  scss/at-mixin-pattern:
    - "^([_|-]*[a-z][a-z0-9]*)(-[a-z0-9]+)*-*$"
    - message: "Expected mixin to be kebab-case"
  scss/dollar-variable-pattern:
    - "^([_|-]*[a-z][a-z0-9]*)(-[a-z0-9]+)*-*$"
    - message: "Expected variable to be kebab-case"
  scss/at-rule-conditional-no-parentheses: null
